name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./backend[dev,ml]"

      - name: Ruff
        working-directory: backend
        run: ruff check . --no-cache

      - name: Mypy
        working-directory: backend
        run: mypy src --cache-dir .mypy_cache

      - name: Pytest
        working-directory: backend
        run: pytest

      - name: Export OpenAPI
        working-directory: backend
        run: python -m futpredict.cli export-openapi --output ../frontend/src/api/openapi.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend
        working-directory: frontend
        run: npm install

      - name: Generate API types
        working-directory: frontend
        run: npm run generate:api-types

      - name: Build frontend
        working-directory: frontend
        run: npm run build
