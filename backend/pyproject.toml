[project]
name = "futpredict"
version = "0.1.0"
description = "Prediccion probabilistica 1X2 de futbol con evaluacion honesta."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.8.0",
    "python-dateutil>=2.9.0",
    "sqlalchemy>=2.0.0",
    "typer>=0.16.0",
    "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.17.0",
    "pandas-stubs>=2.3.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.12.0",
]
ml = [
    "scikit-learn>=1.7.0",
    "scipy>=1.15.0",
    "soccerdata>=1.9.0",
    "penaltyblog>=1.6.0",
]

[project.scripts]
futpredict = "futpredict.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/futpredict"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
mypy_path = "src"
